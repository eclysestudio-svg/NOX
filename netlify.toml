[build]
  publish = "."

# Redirect /success to the success page anchor (Netlify form submission)
[[redirects]]
  from = "/success"
  to = "/?form=success#waitlist"
  status = 302

# Optional: security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
